name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in main.js preload.js electron-builder.cjs renderer/*.js src/*.js scripts/*.js test/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test

  package-windows:
    name: Package Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Windows app
        run: npm run pack:win

  # The local whisper runtime is downloaded (Windows/Linux) or built from source
  # with cmake (macOS), so this job is slow and depends on an upstream release
  # being reachable. Running it on every pull request would put a multi-minute
  # native build and a network dependency on the critical path of changes that
  # cannot affect it, so it is limited to pushes and to PRs that touch the
  # runtime itself.
  runtime-smoke:
    name: Local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'whisper-runtime')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore prepared runtime
        uses: actions/cache@v4
        with:
          path: .cache/whisper-runtime
          key: whisper-runtime-1.9.1-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare pinned runtime
        run: npm run prepare:whisper

      - name: Launch runtime smoke test
        run: npm run verify:whisper-runtime
